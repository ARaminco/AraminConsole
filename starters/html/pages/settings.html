<section class="ac-page" data-page="settings">
  <header class="ac-page-head" data-ac="largetitle">
    <div class="ac-page-head__titles"><h1 class="ac-page-head__title">Settings</h1></div>
  </header>
  <div class="ac-card"><div class="ac-card__body">
    <form class="ac-form ac-stack" data-ac="form" novalidate>
      <div><label class="ac-label" for="s-name">Display name</label>
        <input class="ac-input" id="s-name" name="name" data-ac-rules="required" autocomplete="name"></div>
      <div><label class="ac-label" for="s-mobile">Mobile</label>
        <input class="ac-input ac-ltr" id="s-mobile" name="mobile" data-ac-rules="required|iran-mobile" inputmode="tel" placeholder="09123456789"></div>
      <button class="ac-btn ac-btn--primary" type="submit">Save</button>
    </form>
  </div></div>
</section>
