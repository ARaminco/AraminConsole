<body data-page="offline">
  <main class="ac-fullpage err">
    <div class="sa-top">
      <a class="ac-chrome ac-brand" href="../" aria-label="Aramin">
        <span class="ac-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20 12 4l7 16"/><path d="M8.2 13.5h7.6"/></svg></span>

      <div class="ac-chrome sa-tools">
        <div data-ac="langpicker"></div>
        <button class="ac-iconbtn" type="button" data-action="theme" aria-label="Toggle theme" data-i18n-attr="aria-label:app.theme"><svg class="ac-icon ac-only-light" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ac-icon ac-only-dark" aria-hidden="true"><use href="#i-sun"/></svg></button>

          <g class="ill-ink-s" stroke-width="10" stroke-linecap="round">
            <path d="M118 112a62 62 0 0 1 84 0"/>
            <path d="M134 130a36 36 0 0 1 52 0"/>
          </g>
          <circle class="ill-ink" cx="160" cy="146" r="7"/>
          <path class="ill-acc-s" d="M112 70l92 86" stroke-width="12" stroke-linecap="round"/>
        </g>
        <g class="ill-dots"><circle class="ill-acc" cx="146" cy="182" r="4.5"/><circle class="ill-acc" cx="160" cy="182" r="4.5"/><circle class="ill-acc" cx="174" cy="182" r="4.5"/></g>
        <g class="ill-float ill-float--slow">
          <rect class="ill-ink" x="40" y="168" width="44" height="26" rx="10"/>
          <path class="ill-ink-s" d="M48 168v-10M76 168v-10" stroke-width="5" stroke-linecap="round"/>
          <path class="ill-acc-s" d="M84 181h22" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 8"/>

      <p class="err-text" data-i18n="errpage.pOffline">صفحه‌هایی که قبلاً باز کرده‌اید همچنان در دسترس‌اند. به محض وصل شدن، خودکار برمی‌گردیم.</p>
      
      <div class="err-actions">
        <button class="ac-btn ac-btn--primary" type="button" data-action="retry"><svg class="ac-icon" aria-hidden="true"><use href="#i-refresh-cw"/></svg><span data-i18n="errpage.retry">تلاش دوباره</span></button>
        <a class="ac-btn ac-btn--outline" href="../#/dashboard"><svg class="ac-icon" aria-hidden="true"><use href="#i-house"/></svg><span data-i18n="errpage.home">بازگشت به داشبورد</span></a>

    </div>
  </main>
  <a class="ac-powered ac-powered--page ac-powered--float" href="https://air.co.ir/" target="_blank" rel="noopener"><span data-i18n="credit.powered">قدرت گرفته از ایر</span></a>
