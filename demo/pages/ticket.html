<section class="ac-page" data-page="ticket" data-script>
  <header class="ac-page-head" data-ac="largetitle">
    <div class="ac-page-head__titles">
      <span class="ac-page-head__eyebrow"><a class="ac-tk-crumb" href="#/tickets"><svg class="ac-icon ac-icon--sm ac-flip-rtl" aria-hidden="true"><use href="#i-arrow-left"/></svg><span data-i18n="tk.backToQueue">صف تیکت‌ها</span></a></span>
      <h1 class="ac-page-head__title" data-tk-title>تیکت</h1>
      <p class="ac-page-head__sub" data-tk-sub></p>
    </div>
    <div class="ac-page-head__actions">
      <div class="ac-btn-group">
        <a class="ac-btn ac-btn--icon" href="#/tickets" data-tk-prev aria-label="Previous" data-i18n-attr="aria-label:tk.prev"><svg class="ac-icon ac-flip-rtl" aria-hidden="true"><use href="#i-chevron-left"/></svg></a>
        <a class="ac-btn ac-btn--icon" href="#/tickets" data-tk-next aria-label="Next" data-i18n-attr="aria-label:tk.next"><svg class="ac-icon ac-flip-rtl" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
      </div>
      <button class="ac-btn ac-btn--primary" type="button" data-tk-solve><svg class="ac-icon" aria-hidden="true"><use href="#i-circle-check-big"/></svg><span data-i18n="tk.markSolved">حل‌شده</span></button>
    </div>
  </header>
  <div data-tk-detail></div>
</section>
