name: Feature request
description: Suggest a component, module, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to build?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Markup and API sketch (data-ac name, options, events) if you have one.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Core, Shell, Forms, Data display, Overlays, Iranian toolkit, Starters, Docs, AI kit]
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I can help implement this
